name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: build / vet / fmt / test (race)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-formatted:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: Test (race)
        run: go test -race -count=1 ./...
