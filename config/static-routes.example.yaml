# Routes for backends that aren't Docker containers (e.g. the NAS itself).
# Merged into the same routing table as docker-label-discovered routes;
# on a subdomain collision with a docker route, the static entry wins.
routers:
  - subdomain: nas
    port: 5000
    addresses: ["192.168.1.10"]

  - subdomain: printer
    port: 631
    addresses: ["192.168.1.11"]

  # The apex BASE_DOMAIN itself (e.g. https://nas2.example.com/): use the
  # DNS-zone style subdomain "@" (quoted; a bare @ is not valid YAML).
  # - subdomain: "@"
  #   port: 443
  #   addresses: ["192.168.1.10"]
  #   protocol: https
  #   tls:
  #     insecure_skip_verify: true
