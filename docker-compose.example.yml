# Example wiring of: this control plane + Envoy + a placeholder for the
# separate envoy-acme control plane + one auto-routed demo service.
#
# envoy-acme is NOT part of this repo. It must serve TLS certs via SDS
# (gRPC) reachable at ACME_SDS_HOST:ACME_SDS_PORT below, for a secret named
# CERT_SECRET_NAME covering *.${BASE_DOMAIN}.

services:
  envoy-control-plane:
    build: .
    environment:
      BASE_DOMAIN: nas.pfrem.me
      HTTP_PORT: "80"
      HTTPS_PORT: "443"
      XDS_PORT: "18000"
      DOCKER_NETWORK: proxy
      CERT_SECRET_NAME: wildcard-cert
      ACME_SDS_CLUSTER_NAME: acme_sds_cluster
      STATIC_CONFIG_PATH: /etc/envoy-control-plane/static-routes.yaml
      # Optional OAuth SSO profiles selected by envoy.http.routers.<r>.sso
      # (see docs/LABELS.md "SSO"). Unset disables SSO. The profiles' secret
      # files are mounted into the envoy service, not here.
      SSO_CONFIG_PATH: /etc/envoy-control-plane/sso.yaml
      # Optional TCP routing/TLS passthrough: "name=port,name2=port2".
      # Container labels may only select among these names (see docs/LABELS.md);
      # they can never bind a new host port of their own.
      TCP_ENTRYPOINTS: "websecure=8443,db=5432"
      TCP_DEFAULT_ENTRYPOINT: websecure
      # Optional extra HTTP/HTTPS entrypoints, same "name=port" shape and the
      # same never-bind-arbitrary-sockets rule as TCP_ENTRYPOINTS above. The
      # legacy HTTP_PORT/HTTPS_PORT pair always exists regardless of this.
      HTTP_ENTRYPOINTS: "admin=8444"
      # Optional read-only HTML page showing discovered/configured routes.
      INFO_ENDPOINT_ENABLED: "true"
      INFO_PORT: "9902"
    volumes:
      # Read-only is enough - the control plane only lists/inspects/watches.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/static-routes.example.yaml:/etc/envoy-control-plane/static-routes.yaml:ro
      - ./config/sso.example.yaml:/etc/envoy-control-plane/sso.yaml:ro
    ports:
      - "9902:9902" # info page - http://localhost:9902/, drop if you don't want it exposed
    networks:
      - proxy
    # Runs as root in the image so it can read /var/run/docker.sock, which
    # is normally owned by root/the docker group on the host.

  envoy:
    image: envoyproxy/envoy:v1.37-latest
    depends_on:
      - envoy-control-plane
    environment:
      CONTROL_PLANE_HOST: envoy-control-plane
      XDS_PORT: "18000"
      ACME_SDS_HOST: envoy-acme
      ACME_SDS_PORT: "19000"
      ACME_SDS_CLUSTER_NAME: acme_sds_cluster
      ENVOY_ADMIN_PORT: "9901"
      ENVOY_NODE_ID: envoy-1
    entrypoint:
      - sh
      - -c
      - |
        set -e
        sed \
          -e "s|\$${CONTROL_PLANE_HOST}|$$CONTROL_PLANE_HOST|g" \
          -e "s|\$${XDS_PORT}|$$XDS_PORT|g" \
          -e "s|\$${ACME_SDS_HOST}|$$ACME_SDS_HOST|g" \
          -e "s|\$${ACME_SDS_PORT}|$$ACME_SDS_PORT|g" \
          -e "s|\$${ACME_SDS_CLUSTER_NAME}|$$ACME_SDS_CLUSTER_NAME|g" \
          -e "s|\$${ENVOY_ADMIN_PORT}|$$ENVOY_ADMIN_PORT|g" \
          -e "s|\$${ENVOY_NODE_ID}|$$ENVOY_NODE_ID|g" \
          /etc/envoy/bootstrap.yaml.tmpl > /etc/envoy/bootstrap.yaml
        exec envoy -c /etc/envoy/bootstrap.yaml
    volumes:
      - ./envoy/bootstrap.yaml.tmpl:/etc/envoy/bootstrap.yaml.tmpl:ro
      # File-based SDS secrets referenced by the SSO profiles' sds_path
      # (sso-nas-hmac.yaml, sso-nas-token.yaml; format in docs/LABELS.md
      # "SDS secret files"). Read by Envoy only; create both files before
      # starting, or Envoy cannot bring up the HTTPS listener serving the
      # SSO router.
      - ./secrets/sso:/etc/envoy/secrets:ro
    ports:
      - "80:80"
      - "443:443"
      - "9901:9901" # admin interface - drop this in production
      # TCP entrypoints declared above (TCP_ENTRYPOINTS) bind on the Envoy
      # container; expose the ones you want reachable from the host.
      - "8443:8443" # websecure TCP entrypoint (TLS passthrough demo below)
      - "5432:5432" # db TCP entrypoint (raw TCP demo below)
      # HTTP entrypoints declared above (HTTP_ENTRYPOINTS); same idea.
      - "8444:8444" # admin HTTP entrypoint (see myapp-admin demo below)
    networks:
      - proxy

  # envoy-acme:
  #   image: your-envoy-acme-image
  #   environment:
  #     BASE_DOMAIN: nas.pfrem.me
  #     CERT_SECRET_NAME: wildcard-cert
  #     SDS_PORT: "19000"
  #   networks:
  #     - proxy

  # Demo service: automatically becomes https://myapp.nas.pfrem.me
  myapp:
    image: nginx:alpine
    labels:
      envoy.enable: "true"
      envoy.http.routers.web.subdomain: myapp
      envoy.http.routers.web.port: "80"
      envoy.http.routers.web.middlewares: local-limit,basic,strip-api,app-prefix,secure-headers

      # Envoy's native basic_auth filter supports {SHA} htpasswd entries.
      # If an accepted hash contains '$', Compose requires every '$' doubled.
      envoy.http.middlewares.basic.basicauth.users: "demo:{SHA}W6ph5Mm5Pz8GgiULbPgzG37mj9g="
      envoy.http.middlewares.basic.basicauth.realm: "demo"
      envoy.http.middlewares.basic.basicauth.removeheader: "true"
      envoy.http.middlewares.local-limit.ratelimit.average: "10"
      envoy.http.middlewares.local-limit.ratelimit.burst: "20"
      envoy.http.middlewares.local-limit.ratelimit.period: "1s"
      envoy.http.middlewares.strip-api.stripprefix.prefixes: /api,/v1
      envoy.http.middlewares.app-prefix.addprefix.prefix: /internal
      envoy.http.middlewares.secure-headers.headers.response.X-Content-Type-Options: nosniff
      envoy.http.middlewares.secure-headers.headers.removeresponse: Server

      # Observability hooks: trace this router's traffic with a named span,
      # and record accesslog=true as route metadata (see docs/LABELS.md;
      # access logging itself is configured listener-wide in bootstrap.yaml.tmpl).
      envoy.http.routers.web.tracing: "true"
      envoy.http.routers.web.tracing.operationname: myapp-ingress
      envoy.http.routers.web.accesslog: "true"
    networks:
      - proxy

  # Same demo app, additionally reachable on the dedicated "admin" HTTP
  # entrypoint declared above (HTTP_ENTRYPOINTS=admin=8444) as
  # https://myapp-admin.nas.pfrem.me:8444, alongside the default entrypoint.
  myapp-admin:
    image: nginx:alpine
    labels:
      envoy.enable: "true"
      envoy.http.routers.admin.subdomain: myapp-admin
      envoy.http.routers.admin.port: "80"
      envoy.http.routers.admin.entrypoints: admin
    networks:
      - proxy

  # SSO demo: https://files.nas.pfrem.me is only reachable after logging in
  # through the "nas" profile in config/sso.example.yaml. Machine clients can
  # send "Authorization: Bearer <JWT from the same issuer>" instead.
  files:
    image: nginx:alpine
    labels:
      envoy.enable: "true"
      envoy.http.routers.files.subdomain: files
      envoy.http.routers.files.port: "80"
      envoy.http.routers.files.sso: nas
      # For long-lived, mostly quiet streams (SSE, long polling) disable the
      # route's stream idle timeout (Envoy default 5m) and the route timeout:
      #   envoy.http.routers.files.idletimeout: "0s"
      #   envoy.http.routers.files.timeout: "0s"
      # WebSocket upgrades are not proxied yet (see docs/LABELS.md
      # "Protocol support"); the same idletimeout advice will apply to them.
    networks:
      - proxy

  # Demo TCP service: raw TCP on the "db" entrypoint (5432), no TLS
  # inspection required since the rule is the mandatory catch-all for raw
  # routers. Reachable at <docker-host>:5432.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo
    labels:
      envoy.enable: "true"
      envoy.tcp.routers.postgres.rule: "HostSNI(*)"
      envoy.tcp.routers.postgres.service: postgres
      envoy.tcp.routers.postgres.entrypoints: db
      envoy.tcp.services.postgres.loadbalancer.servers.0.port: "5432"
    networks:
      - proxy

networks:
  proxy:
    name: proxy
